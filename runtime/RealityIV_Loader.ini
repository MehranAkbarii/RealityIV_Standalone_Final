; Optional. Place next to RealityIV.asi. Every key has a working default.
[RealityIV]

; registry (default): the layer is added under HKCU\SOFTWARE\Khronos\Vulkan\ImplicitLayers
;                     while the game runs and removed again on exit.
; env:                sets VK_ADD_IMPLICIT_LAYER_PATH instead (nothing in the registry),
;                     needs Vulkan loader 1.3.234 or newer.
LayerMode=registry

; 1 = set RESHADE_DISABLE_GRAPHICS_HOOK. Only try this if ReShade.log shows it also
;     hooking Direct3D 9 (double effects / two overlays). Default 0.
DisableGraphicsHook=0

; 1 = set RESHADE_DISABLE_LOADING_CHECK (the original project already did this).
DisableLoadingCheck=1
